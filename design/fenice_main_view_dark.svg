<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" style="background:#08080A; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Ambient Background Radial Vignette -->
    <radialGradient id="bgVignette" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#121217" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0A0A0D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="1"/>
    </radialGradient>

    <!-- Core Singularity Void -->
    <radialGradient id="singularityVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#191312" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0B0B0E" stop-opacity="1"/>
      <stop offset="88%" stop-color="#070709" stop-opacity="1"/>
      <stop offset="100%" stop-color="#18181E" stop-opacity="1"/>
    </radialGradient>

    <!-- Phoenix Ember Glow -->
    <radialGradient id="emberBloom" cx="56%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.38"/>
      <stop offset="30%" stop-color="#FF5500" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#FF3300" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>

    <!-- Ember Accent Linear Gradient -->
    <linearGradient id="emberArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#FF5500" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#FFB800" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFF3D1" stop-opacity="1"/>
    </linearGradient>

    <!-- Silver Ash Spectral Gradient -->
    <linearGradient id="ashFilament" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F6" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for Core Interior -->
    <clipPath id="coreClip">
      <circle cx="480" cy="288" r="148"/>
    </clipPath>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="960" height="600" fill="url(#bgVignette)"/>

  <!-- Whisper-Subtle Architectural Axis Hairlines -->
  <line x1="480" y1="48" x2="480" y2="532" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
  <line x1="0" y1="288" x2="960" y2="288" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
  <circle cx="480" cy="288" r="236" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" stroke-dasharray="2 8"/>

  <!-- 2. Top Minimal Header Bar (48px) -->
  <g id="topBar">
    <rect x="0" y="0" width="960" height="48" fill="#09090C" fill-opacity="0.85"/>
    <line x1="0" y1="48" x2="960" y2="48" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Brand Identity -->
    <g transform="translate(28, 29)">
      <circle cx="0" cy="-5" r="3.5" fill="none" stroke="#FF5500" stroke-width="1.5"/>
      <circle cx="0" cy="-5" r="1" fill="#FFB800"/>
      <text x="14" y="0" fill="#F4F4F6" font-size="12" font-weight="600" letter-spacing="5">FENICE</text>
      <text x="96" y="-1" fill="#52525B" font-size="9" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">CORE // 1.0</text>
    </g>

    <!-- Center Minimal User Kit Pill -->
    <g transform="translate(370, 10)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
      <path d="M 18 11 L 14 14 L 18 17" fill="none" stroke="#71717A" stroke-width="1.2" stroke-linecap="round"/>
      <text x="110" y="18" fill="#E4E4E7" font-size="10.5" font-weight="500" letter-spacing="1.4" text-anchor="middle">USER KIT // 01 · NOCTURNE</text>
      <path d="M 202 11 L 206 14 L 202 17" fill="none" stroke="#71717A" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Right Controls: Theme Indicator + MAIN / PRO Switch -->
    <g transform="translate(756, 10)">
      <!-- Subtle Rebirth Action Trigger -->
      <rect x="-68" y="0" width="58" height="28" rx="14" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="-52" cy="14" r="2.5" fill="#FF5500"/>
      <text x="-32" y="17.5" fill="#A1A1AA" font-size="9" font-family="'JetBrains Mono', monospace" letter-spacing="1" text-anchor="middle">MORPH</text>

      <!-- MAIN / PRO Segmented Pill -->
      <rect x="0" y="0" width="176" height="28" rx="14" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="3" y="3" width="85" height="22" rx="11" fill="#1C1C24" stroke="#FF5500" stroke-opacity="0.45" stroke-width="1"/>
      <text x="45.5" y="17.5" fill="#F4F4F6" font-size="9.5" font-weight="600" letter-spacing="2" text-anchor="middle">MAIN</text>
      <text x="131" y="17.5" fill="#71717A" font-size="9.5" font-weight="500" letter-spacing="2" text-anchor="middle">PRO</text>
    </g>
  </g>

  <!-- 3. THE FENICE ECLIPSE — Single Monumental Centerpiece Control -->
  <g id="feniceEclipseCenterpiece">
    <!-- Outer Dimensional Halo -->
    <circle cx="480" cy="288" r="196" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="480" cy="288" r="178" fill="none" stroke="#16161D" stroke-width="18"/>
    <circle cx="480" cy="288" r="187" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <circle cx="480" cy="288" r="169" fill="none" stroke="#000000" stroke-opacity="0.8" stroke-width="1.5"/>

    <!-- Precision Machined Degree Ticks around Outer Ring -->
    <g stroke="#71717A" stroke-opacity="0.35" stroke-width="1">
      <line x1="480" y1="84" x2="480" y2="92" stroke="#F4F4F6" stroke-opacity="0.6"/>
      <line x1="684" y1="288" x2="676" y2="288" stroke="#F4F4F6" stroke-opacity="0.6"/>
      <line x1="480" y1="492" x2="480" y2="484" stroke="#F4F4F6" stroke-opacity="0.6"/>
      <line x1="276" y1="288" x2="284" y2="288" stroke="#F4F4F6" stroke-opacity="0.6"/>
      <line x1="624" y1="144" x2="618" y2="150"/>
      <line x1="624" y1="432" x2="618" y2="426"/>
      <line x1="336" y1="432" x2="342" y2="426"/>
      <line x1="336" y1="144" x2="342" y2="150"/>
      <!-- Fine Sub-ticks -->
      <circle cx="480" cy="288" r="178" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4" stroke-dasharray="1 11.65"/>
    </g>

    <!-- Active Outer Ring Arc: Spectral Entropy / Chimera Orbit (74%) -->
    <path d="M 354.1 413.9 A 178 178 0 1 1 634.1 199.0" fill="none" stroke="url(#emberArc)" stroke-width="3.5" stroke-linecap="round" filter="url(#subtleGlow)"/>
    <!-- Outer Ring Handle Satellite -->
    <circle cx="634.1" cy="199.0" r="6" fill="#09090B" stroke="#FFB800" stroke-width="2" filter="url(#subtleGlow)"/>
    <circle cx="634.1" cy="199.0" r="2" fill="#FFF3D1"/>

    <!-- Inner Singularity Well (Clipped 2D Spectral Field) -->
    <circle cx="480" cy="288" r="150" fill="url(#singularityVoid)" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    
    <g clip-path="url(#coreClip)">
      <!-- Subtle Ember Ambient Bloom following the 2D Node -->
      <circle cx="480" cy="288" r="150" fill="url(#emberBloom)"/>

      <!-- Concentric Harmonic Radar Rings -->
      <circle cx="480" cy="288" r="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
      <circle cx="480" cy="288" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="2 6"/>
      <circle cx="480" cy="288" r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

      <!-- Generative Organic Spectral Filaments (Monochrome Silver Ash + Warm Ember Highlight) -->
      <g fill="none" stroke-linecap="round">
        <!-- Silver Ash Background Spectral Contours -->
        <path d="M 332 298 C 378 220, 442 340, 514 252 C 558 198, 594 264, 628 242" stroke="url(#ashFilament)" stroke-width="1.2"/>
        <path d="M 332 272 C 385 338, 452 204, 516 268 C 565 316, 596 238, 628 278" stroke="url(#ashFilament)" stroke-width="1.0"/>
        <path d="M 338 326 C 392 268, 445 362, 512 246 C 562 162, 598 292, 624 310" stroke="#E4E4E7" stroke-opacity="0.16" stroke-width="1"/>
        <path d="M 342 246 C 398 196, 448 298, 514 252 C 568 214, 590 296, 622 256" stroke="#E4E4E7" stroke-opacity="0.22" stroke-width="1"/>

        <!-- Radial Spectral Tiling Vectors converging toward Singularity Lens (514, 252) -->
        <g stroke="#F4F4F6" stroke-opacity="0.12" stroke-width="0.8">
          <line x1="480" y1="140" x2="514" y2="252"/>
          <line x1="585" y1="183" x2="514" y2="252"/>
          <line x1="628" y1="288" x2="514" y2="252"/>
          <line x1="585" y1="393" x2="514" y2="252"/>
          <line x1="480" y1="436" x2="514" y2="252"/>
          <line x1="375" y1="393" x2="514" y2="252"/>
          <line x1="332" y1="288" x2="514" y2="252"/>
          <line x1="375" y1="183" x2="514" y2="252"/>
        </g>

        <!-- Primary Ignited Phoenix Spectral Harmonics -->
        <path d="M 334 312 C 384 282, 434 218, 514 252 C 562 272, 594 218, 628 232" stroke="#FF5500" stroke-opacity="0.55" stroke-width="2" filter="url(#subtleGlow)"/>
        <path d="M 336 264 C 394 294, 456 286, 514 252 C 560 225, 592 268, 626 264" stroke="#FFB800" stroke-opacity="0.85" stroke-width="1.6" filter="url(#subtleGlow)"/>
        <path d="M 348 344 C 408 312, 464 234, 514 252 C 556 266, 588 308, 618 294" stroke="#F4F4F6" stroke-opacity="0.65" stroke-width="1.2"/>
      </g>

      <!-- 2D Magnetic Singularity Node (Interactive Focal Lens at X: 514, Y: 252) -->
      <g transform="translate(514, 252)">
        <!-- Aperture Size Ring (Controlled by Scroll Wheel) -->
        <circle cx="0" cy="0" r="36" fill="none" stroke="#FFB800" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="0" cy="0" r="22" fill="#FF5500" fill-opacity="0.08" stroke="#FF5500" stroke-opacity="0.65" stroke-width="1.2" filter="url(#subtleGlow)"/>
        <!-- Precision Crosshair -->
        <line x1="-10" y1="0" x2="-4" y2="0" stroke="#F4F4F6" stroke-opacity="0.8" stroke-width="1"/>
        <line x1="4" y1="0" x2="10" y2="0" stroke="#F4F4F6" stroke-opacity="0.8" stroke-width="1"/>
        <line x1="0" y1="-10" x2="0" y2="-4" stroke="#F4F4F6" stroke-opacity="0.8" stroke-width="1"/>
        <line x1="0" y1="4" x2="0" y2="10" stroke="#F4F4F6" stroke-opacity="0.8" stroke-width="1"/>
        <!-- Core Singularity Point -->
        <circle cx="0" cy="0" r="4.5" fill="#FFF3D1" stroke="#FF5500" stroke-width="2" filter="url(#glowSoft)"/>
      </g>
    </g>

    <!-- Ultra-Clean Architectural Readouts Flanking the Eclipse -->
    <!-- Left Readout: X/Y Singularity Vector -->
    <g transform="translate(198, 276)" text-anchor="end">
      <text x="0" y="0" fill="#52525B" font-size="8.5" font-weight="600" letter-spacing="2">CHIMERA BIAS // X·Y</text>
      <text x="0" y="18" fill="#E4E4E7" font-size="13" font-family="'JetBrains Mono', monospace" letter-spacing="1">+0.64  <tspan fill="#FF5500">·</tspan>  0.78</text>
      <text x="0" y="34" fill="#52525B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="1">HARMONIC LOCK</text>
    </g>
    <line x1="212" y1="288" x2="266" y2="288" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Right Readout: Outer Ring Orbit & Aperture -->
    <g transform="translate(762, 276)" text-anchor="start">
      <text x="0" y="0" fill="#52525B" font-size="8.5" font-weight="600" letter-spacing="2">SPECTRAL FLUX // ORBIT</text>
      <text x="0" y="18" fill="#E4E4E7" font-size="13" font-family="'JetBrains Mono', monospace" letter-spacing="1">74.2%  <tspan fill="#FFB800">·</tspan>  32ms</text>
      <text x="0" y="34" fill="#52525B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="1">TILING APERTURE</text>
    </g>
    <line x1="694" y1="288" x2="748" y2="288" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Bottom Center Micro-Caption under Core -->
    <text x="480" y="514" fill="#52525B" font-size="8.5" font-family="'JetBrains Mono', monospace" letter-spacing="2.1" text-anchor="middle">DRAG CORE: X/Y MORPH   ·   RING: ENTROPY   ·   SCROLL: APERTURE   ·   DROP WAV: LOAD</text>
  </g>

  <!-- 4. Bottom Recessed User Sample Dock (60px height, whisper-minimal) -->
  <g id="bottomSampleStrip" transform="translate(0, 540)">
    <rect x="0" y="0" width="960" height="60" fill="#070709"/>
    <line x1="0" y1="0" x2="960" y2="0" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

    <text x="28" y="33" fill="#52525B" font-size="8.5" font-weight="600" letter-spacing="2">SOURCES</text>

    <!-- 8 User Sample Drop/Playback Micro-Slots (Roman Numerals I - VIII) -->
    <g transform="translate(106, 15)" font-family="'JetBrains Mono', monospace" font-size="8.5">
      <!-- Slot I (User Loaded - High Contribution) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="84" height="28" rx="6" fill="#121217" stroke="#FF5500" stroke-opacity="0.55" stroke-width="1"/>
        <circle cx="11" cy="14" r="2.5" fill="#FFB800"/>
        <text x="19" y="17.2" fill="#F4F4F6" letter-spacing="0.2">I·PIANO.W</text>
        <line x1="10" y1="24" x2="68" y2="24" stroke="#FF5500" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <!-- Slot II (User Loaded - Medium Contribution) -->
      <g transform="translate(92, 0)">
        <rect x="0" y="0" width="84" height="28" rx="6" fill="#101014" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
        <circle cx="11" cy="14" r="2" fill="#FF5500" fill-opacity="0.85"/>
        <text x="19" y="17.2" fill="#D4D4D8" letter-spacing="0.2">II·VOX_CH</text>
        <line x1="10" y1="24" x2="54" y2="24" stroke="#E4E4E7" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <!-- Slot III (User Loaded - Active) -->
      <g transform="translate(184, 0)">
        <rect x="0" y="0" width="84" height="28" rx="6" fill="#121217" stroke="#FF5500" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="11" cy="14" r="2.5" fill="#FF5500"/>
        <text x="19" y="17.2" fill="#F4F4F6" letter-spacing="0.2">III·TAPE</text>
        <line x1="10" y1="24" x2="62" y2="24" stroke="#FF5500" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <!-- Slot IV (User Loaded - Low Contribution) -->
      <g transform="translate(276, 0)">
        <rect x="0" y="0" width="84" height="28" rx="6" fill="#0D0D11" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
        <circle cx="11" cy="14" r="2" fill="#71717A"/>
        <text x="19" y="17.2" fill="#A1A1AA" letter-spacing="0.2">IV·BRASS</text>
        <line x1="10" y1="24" x2="36" y2="24" stroke="#71717A" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <!-- Slot V (Empty User Drop Slot) -->
      <g transform="translate(368, 0)">
        <rect x="0" y="0" width="84" height="28" rx="6" fill="#0A0A0D" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2.5 2.5"/>
        <text x="42" y="17.2" fill="#52525B" text-anchor="middle" letter-spacing="0.5">V · + DROP</text>
      </g>
      <!-- Slot VI (Empty User Drop Slot) -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="84" height="28" rx="6" fill="#0A0A0D" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2.5 2.5"/>
        <text x="42" y="17.2" fill="#52525B" text-anchor="middle" letter-spacing="0.5">VI · + DROP</text>
      </g>
      <!-- Slot VII (Empty User Drop Slot) -->
      <g transform="translate(552, 0)">
        <rect x="0" y="0" width="84" height="28" rx="6" fill="#0A0A0D" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2.5 2.5"/>
        <text x="42" y="17.2" fill="#52525B" text-anchor="middle" letter-spacing="0.5">VII · + DROP</text>
      </g>
      <!-- Slot VIII (Empty User Drop Slot) -->
      <g transform="translate(644, 0)">
        <rect x="0" y="0" width="84" height="28" rx="6" fill="#0A0A0D" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2.5 2.5"/>
        <text x="42" y="17.2" fill="#52525B" text-anchor="middle" letter-spacing="0.5">VIII·+ DROP</text>
      </g>
    </g>

    <!-- Right Output Level Hairline Meter -->
    <g transform="translate(862, 22)">
      <text x="0" y="11" fill="#52525B" font-size="8.5" font-family="'JetBrains Mono', monospace">OUT</text>
      <rect x="28" y="4" width="42" height="3" rx="1.5" fill="#18181E"/>
      <rect x="28" y="4" width="32" height="3" rx="1.5" fill="#E4E4E7"/>
      <rect x="28" y="9" width="42" height="3" rx="1.5" fill="#18181E"/>
      <rect x="28" y="9" width="30" height="3" rx="1.5" fill="#FF5500"/>
    </g>
  </g>
</svg>
